# 正则化试点 · dropout 0.1→0.2（fold 模板，train_5fold(_parallel) 改写每折路径）。
# 动机（§15.10）：5-seed 集成后 GT 剩余缺口是 q_spearman_pep_seq（63.84 vs
# dbond_s 65.06，差 1.2）与 Top10_seq——序列级泛化方差问题。集成是推理期方差
# 缩减，dropout 上调是训练期同方向杠杆（推测#3：F1 或微降，q_seq/variance 改善）。
# 单变量：除 dropout 0.1→0.2 外与 pre_synthesis_fold1222_theory_film.yaml 完全
# 一致（含 FiLM/折叠/group_uniform/q 软标签）。
# 晋级判据：五折 q_seq > 62.52（film 底座）且 lab_F1 跌幅 ≤0.3 → 值得做
# 5-seed 集成重跑；否则证伪，转 weight_decay ×5 臂。
